name: "Debug Build"

on: [push,workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: [windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        submodules: 'true'
        fetch-depth: 0
        
    - name: Setup NuGet
      run: nuget restore .\packages.config -PackagesDirectory .\packages\ 

    - name: Install WDK
      shell: powershell
      run: |
        winget install Microsoft.WindowsWDK.10.0.28000 -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::WDK install failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Driver (UDF)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        msbuild .\ComPort\htsvsp.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:minimal
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::Driver build failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Build vspControl
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        msbuild .\App\vspControl\vspControl.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:minimal
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::vspControl build failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Package Artifacts
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        Write-Host "=== ComPort\x64\Debug ==="
        Get-ChildItem "ComPort\x64\Debug" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
        Write-Host "=== vspControl\x64\Debug ==="
        Get-ChildItem "App\vspControl\x64\Debug" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
        Compress-Archive -Path "ComPort\x64\Debug\*" -DestinationPath "$env:RUNNER_TEMP\htsvsp-driver.zip" -Force
        Compress-Archive -Path "App\vspControl\x64\Debug\*" -DestinationPath "$env:RUNNER_TEMP\vspcontrol.zip" -Force
        Get-Item "$env:RUNNER_TEMP\htsvsp-driver.zip","$env:RUNNER_TEMP\vspcontrol.zip" | ForEach-Object { Write-Host "PACK $($_.Name) $($_.Length) bytes" }

    - name: Publish Release
      shell: powershell
      run: |
        $tag = "debug-build-$env:GITHUB_RUN_NUMBER"
        $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
        try {
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers -TimeoutSec 30
        } catch {
          $body = @{ tag_name = $tag; name = "Debug Build $env:GITHUB_RUN_NUMBER"; body = "Automated debug build for WPF-VSPD integration." } | ConvertTo-Json
          $rel = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers -Body $body -ContentType "application/json" -TimeoutSec 30
        }
        $uploadBase = ($rel.upload_url -replace '\{[^}]*\}', '')
        foreach ($f in @("$env:RUNNER_TEMP\htsvsp-driver.zip", "$env:RUNNER_TEMP\vspcontrol.zip")) {
          $name = Split-Path $f -Leaf
          curl.exe -sS -X POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$f" "$uploadBase?name=$name"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::upload failed $name"; exit 1 }
          Write-Host "UPLOADED $name"
        }
