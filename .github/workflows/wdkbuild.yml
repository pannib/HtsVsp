name: "Debug Build"

on: [push,workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: [windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        submodules: 'true'
        fetch-depth: 0
        
    - name: Setup NuGet
      run: nuget restore .\packages.config -PackagesDirectory .\packages\ 

    - name: Install WDK
      shell: powershell
      run: |
        winget install Microsoft.WindowsWDK.10.0.28000 -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::WDK install failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Driver (UDF)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        msbuild .\ComPort\htsvsp.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:minimal
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::Driver build failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Build vspControl
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        msbuild .\App\vspControl\vspControl.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:minimal
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::vspControl build failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Package Artifacts
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        try {
          $files = Get-ChildItem -Path "ComPort","App" -Recurse -File -ErrorAction Stop | Where-Object { $_.Extension -in ".dll",".exe",".inf",".cat",".pdb",".sys",".inx",".cer" }
          $files | ForEach-Object { Write-Host "ART $($_.FullName.Replace($env:GITHUB_WORKSPACE, '')) $($_.Length)" }
          if (-not $files) { Write-Host "::error::No artifacts found"; exit 1 }
          Compress-Archive -Path $files.FullName -DestinationPath "$env:RUNNER_TEMP\htsvsp-build.zip" -Force
          Write-Host "PACK $(Get-Item "$env:RUNNER_TEMP\htsvsp-build.zip").Length bytes"
        } catch {
          Write-Host "::error::Package step error: $($_.Exception.Message)"
          exit 1
        }

    - name: Publish Release
      shell: powershell
      run: |
        Write-Host "TOKEN_LEN=$($env:GITHUB_TOKEN.Length)"
        Write-Host "REPO=$env:GITHUB_REPOSITORY RUN=$env:GITHUB_RUN_NUMBER"
        $tag = "debug-build-$env:GITHUB_RUN_NUMBER"
        $headers = @{ Authorization = "token $env:GITHUB_TOKEN"; "User-Agent" = "doubao-ci" }
        $rel = $null
        try {
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers -TimeoutSec 30
          Write-Host "GOT existing release $tag"
        } catch {
          Write-Host "GET failed: $($_.Exception.Message)"
          $body = @{ tag_name = $tag; name = "Debug Build $env:GITHUB_RUN_NUMBER"; body = "Automated debug build." } | ConvertTo-Json
          try {
            $rel = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers -Body $body -ContentType "application/json" -TimeoutSec 30
            Write-Host "POST created release $tag"
          } catch {
            Write-Host "::error::POST failed: $($_.Exception.Message)"
            exit 1
          }
        }
        $uploadBase = ($rel.upload_url -replace '\{[^}]*\}', '')
        Write-Host "UPLOAD_URL=$uploadBase"
        $f = "$env:RUNNER_TEMP\htsvsp-build.zip"
        curl.exe -sS -X POST -H "Authorization: token $env:GITHUB_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$f" "$uploadBase?name=htsvsp-build.zip"
        Write-Host "CURL_EXIT=$LASTEXITCODE"
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::upload failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }
