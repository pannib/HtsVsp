name: "Debug Build"

on: [push,workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: [windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        submodules: 'true'
        fetch-depth: 0
        
    - name: Setup NuGet
      run: nuget restore .\packages.config -PackagesDirectory .\packages\ 

    - name: Install WDK
      shell: powershell
      run: |
        winget install Microsoft.WindowsWDK.10.0.28000 -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::WDK install failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Driver (UDF)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        msbuild .\ComPort\htsvsp.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:minimal /fl "/flp:logfile=$env:RUNNER_TEMP\driver.log;verbosity=minimal" *> $null
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          $err = Get-Content "$env:RUNNER_TEMP\driver.log" -Raw -Encoding UTF8
          $errLines = $err -split "`r?`n"
          $rel = $errLines | Where-Object { $_ -match ": (fatal )?error|: warning|error C[0-9]+|error LNK|error MSB|cannot open" } | Select-Object -First 15
          if ($rel) { $rel | ForEach-Object { Write-Host "::error::DRV: $_" } }
          $tail = $err.Substring([Math]::Max(0, $err.Length - 1500))
          Write-Host "::error::DRV TAIL: $tail"
          exit $code
        }

    - name: Build vspControl
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        msbuild .\App\vspControl\vspControl.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:minimal /fl "/flp:logfile=$env:RUNNER_TEMP\app.log;verbosity=minimal"
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          $err = Get-Content "$env:RUNNER_TEMP\app.log" -Raw -Encoding UTF8
          $errLines = $err -split "`r?`n"
          $rel = $errLines | Where-Object { $_ -match ": (fatal )?error|: warning|error C[0-9]+|error LNK|error MSB|cannot open" } | Select-Object -First 15
          if ($rel) { $rel | ForEach-Object { Write-Host "::error::APP: $_" } }
          $tail = $err.Substring([Math]::Max(0, $err.Length - 1500))
          Write-Host "::error::APP TAIL: $tail"
          exit $code
        }

    - name: Publish Release
      if: ${{ always() }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: debug-build-${{ github.run_number }}
        name: Debug Build ${{ github.run_number }}
        body: |
          Automated debug build for WPF-VSPD integration.
          - HtsVsp.dll (UDF user-mode serial driver)
          - htsvsp.inf / htsvsp.cat
          - vspControl.exe
        files: |
          ComPort/x64/Debug/*
          App/vspControl/x64/Debug/*
          bin/**/*.*
        fail_on_unmatched_files: false
