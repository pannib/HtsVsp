name: "Debug Build"

on: [push,workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: [windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        submodules: 'true'
        fetch-depth: 0
        
    - name: Setup NuGet
      run: nuget restore .\packages.config -PackagesDirectory .\packages\ 

    - name: Install WDK
      shell: powershell
      run: |
        winget install Microsoft.WindowsWDK.10.0.28000 -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::WDK install failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Driver (UDF)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        msbuild .\ComPort\htsvsp.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:minimal
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::Driver build failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Build vspControl
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        msbuild .\App\vspControl\vspControl.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:minimal
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::vspControl build failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Package Artifacts
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        try {
          $staging = "$env:RUNNER_TEMP\stage"
          New-Item -ItemType Directory -Force $staging | Out-Null
          $files = Get-ChildItem -Path "ComPort","App" -Recurse -File -ErrorAction Stop | Where-Object { $_.Extension -in ".dll",".exe",".inf",".cat",".pdb",".sys",".inx",".cer" }
          $files | ForEach-Object { Write-Host "ART $($_.FullName.Replace($env:GITHUB_WORKSPACE, '')) $($_.Length)" }
          if (-not $files) { Write-Host "::error::No artifacts found"; exit 1 }
          foreach ($f in $files) {
            $destName = $f.Name
            if (Test-Path (Join-Path $staging $destName)) { $destName = "$($f.Directory.Name)_$($f.Name)" }
            Copy-Item $f.FullName (Join-Path $staging $destName)
          }
          $devcon = ".\packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\c\tools\10.0.28000.0\x64\devcon.exe"
          Copy-Item $devcon "$staging\devcon.exe"
          Write-Host "STAGE files: $((Get-ChildItem $staging -File).Count)"
          Compress-Archive -Path "$staging\*" -DestinationPath "$env:RUNNER_TEMP\htsvsp-build.zip" -Force
          Write-Host "PACK $((Get-Item "$env:RUNNER_TEMP\htsvsp-build.zip").Length) bytes"
        } catch {
          Write-Host "::error::Package step error: $($_.Exception.Message)"
          exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: htsvsp-build
        path: |
          ${{ runner.temp }}/stage/
          ${{ runner.temp }}/htsvsp-build.zip
        if-no-files-found: error

    - name: Publish Release
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $log = "$env:RUNNER_TEMP\publish.log"
        Set-Content -Path $log -Value "start $(Get-Date -Format o)" -Encoding UTF8
        try {
          $tag = "debug-build-$env:GITHUB_RUN_NUMBER"
          $zip = "$env:RUNNER_TEMP\htsvsp-build.zip"
          gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --title "Debug Build $env:GITHUB_RUN_NUMBER" --notes "Automated debug build." 2>&1 | Tee-Object -FilePath $log -Append | Out-Null
          $ghCode = $LASTEXITCODE
          Add-Content -Path $log -Value "gh_code=$ghCode" -Encoding UTF8
          if ($ghCode -eq 0) {
            Add-Content -Path $log -Value "RELEASE_OK" -Encoding UTF8
            Write-Host "RELEASE_OK $tag"
          } else {
            Add-Content -Path $log -Value "FALLBACK_PUSH" -Encoding UTF8
            Copy-Item $zip "$env:GITHUB_WORKSPACE\htsvsp-build.zip" -Force
            git config user.name "pannib"
            git config user.email "15039500683@163.com"
            git checkout -B build-output 2>&1 | Out-Null
            git add -f htsvsp-build.zip 2>&1 | Out-Null
            git -c user.name="pannib" -c user.email="15039500683@163.com" commit -m "artifacts run $env:GITHUB_RUN_NUMBER" 2>&1 | Out-Null
            git push origin build-output --force 2>&1 | Tee-Object -FilePath $log -Append | Out-Null
            $pushCode = $LASTEXITCODE
            Add-Content -Path $log -Value "push_code=$pushCode" -Encoding UTF8
            if ($pushCode -ne 0) {
              $err = Get-Content $log -Raw -Encoding UTF8
              Write-Host "::error::$($err.Substring([Math]::Max(0, $err.Length - 3000)))"
              exit 1
            }
            Add-Content -Path $log -Value "PUSHED" -Encoding UTF8
            Write-Host "PUSHED build-output"
          }
        } catch {
          $err = Get-Content $log -Raw -Encoding UTF8
          Write-Host "::error::EXC $($_.Exception.Message) :: $($err.Substring([Math]::Max(0, $err.Length - 3000)))"
          exit 1
        }
