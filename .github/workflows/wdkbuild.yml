name: "Debug Build"

on: [push,workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: [windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        submodules: 'true'
        fetch-depth: 0
        
    - name: Setup NuGet
      run: nuget restore .\packages.config -PackagesDirectory .\packages\ 

    - name: Install WDK
      shell: powershell
      run: |
        winget install Microsoft.WindowsWDK.10.0.28000 -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::WDK install failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Diagnose
      shell: powershell
      run: |
        $diag = @()
        $diag += "VCTargetsPath=$env:VCTargetsPath"
        $kits = "C:\Program Files (x86)\Windows Kits\10"
        $diag += "Kits10=$(Test-Path $kits)"
        if (Test-Path "$kits\Include") { $diag += "KitsInclude=" + ((Get-ChildItem "$kits\Include").Name -join ",") }
        if (Test-Path "$kits\Lib") { $diag += "KitsLib=" + ((Get-ChildItem "$kits\Lib").Name -join ",") }
        $vs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue
        $diag += "VS=" + (($vs | ForEach-Object { $_.Name }) -join ",")
        foreach ($v in $vs) {
          $ts = Get-ChildItem "$($v.FullName)\*\MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets" -ErrorAction SilentlyContinue
          $diag += "Toolset($($v.Name))=" + (($ts | ForEach-Object { $_.Name }) -join ",")
        }
        Write-Host "::warning::DIAG " + ($diag -join " || ")

    - name: Build Driver (UDF)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        msbuild .\ComPort\htsvsp.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /fl "/flp:logfile=$env:RUNNER_TEMP\driver.log;verbosity=diagnostic"
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          $err = Get-Content "$env:RUNNER_TEMP\driver.log" -Raw -Encoding UTF8
          $tail = $err.Substring([Math]::Max(0, $err.Length - 3500))
          Write-Host "::error::Driver build failed exit=$code :: $tail"
          exit $code
        }

    - name: Build vspControl
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        msbuild .\App\vspControl\vspControl.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /fl "/flp:logfile=$env:RUNNER_TEMP\app.log;verbosity=normal"
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          $err = Get-Content "$env:RUNNER_TEMP\app.log" -Raw -Encoding UTF8
          $tail = $err.Substring([Math]::Max(0, $err.Length - 3500))
          Write-Host "::error::vspControl build failed exit=$code :: $tail"
          exit $code
        }

    - name: Publish Release
      if: ${{ always() }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: debug-build-${{ github.run_number }}
        name: Debug Build ${{ github.run_number }}
        body: |
          Automated debug build for WPF-VSPD integration.
          - HtsVsp.dll (UDF user-mode serial driver)
          - htsvsp.inf / htsvsp.cat
          - vspControl.exe
        files: |
          ComPort/x64/Debug/*
          App/vspControl/x64/Debug/*
          bin/**/*.*
        fail_on_unmatched_files: false
