name: "Debug Build"

on: [push,workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: [windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        submodules: 'true'
        fetch-depth: 0
        
    - name: Setup NuGet
      run: nuget restore .\packages.config -PackagesDirectory .\packages\ 

    - name: Install WDK
      shell: powershell
      run: |
        winget source update --accept-source-agreements 2>&1 | Out-Null
        $log = "$env:RUNNER_TEMP\wdk_install.log"
        & winget install Microsoft.WindowsWDK.10.0.26100 -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity *> $log
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          $err = Get-Content $log -Raw
          $short = $err.Substring(0, [Math]::Min(4000, $err.Length))
          Write-Host "::error::WDK install failed exit=$code :: $short"
          exit $code
        }
        & winget install Microsoft.WindowsSDK.10.0.26100 -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity *> $log
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          $err = Get-Content $log -Raw
          $short = $err.Substring(0, [Math]::Min(4000, $err.Length))
          Write-Host "::error::SDK install failed exit=$code :: $short"
          exit $code
        }
      
    - name: Build Driver (UDF)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild .\ComPort\htsvsp.vcxproj /p:Configuration=Debug /p:Platform=x64 /m

    - name: Build vspControl
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild .\App\vspControl\vspControl.vcxproj /p:Configuration=Debug /p:Platform=x64 /m

    - name: Publish Release
      if: ${{ always() }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: debug-build-${{ github.run_number }}
        name: Debug Build ${{ github.run_number }}
        body: |
          Automated debug build for WPF-VSPD integration.
          - HtsVsp.dll (UDF user-mode serial driver)
          - htsvsp.inf / htsvsp.cat
          - vspControl.exe
        files: |
          ComPort/x64/Debug/*
          App/vspControl/x64/Debug/*
          bin/**/*.*
        fail_on_unmatched_files: false
