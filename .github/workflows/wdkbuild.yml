name: "Debug Build"

on: [push,workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: [windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        submodules: 'true'
        fetch-depth: 0

    - name: Checkout Upstream Sources
      uses: actions/checkout@v4
      with:
        repository: HollisTech/HtsVsp
        path: upstream
        fetch-depth: 1

    - name: Restore Pristine Driver Sources
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        Remove-Item ComPort -Recurse -Force
        Remove-Item inc -Recurse -Force
        Copy-Item "upstream\ComPort" "ComPort" -Recurse
        Copy-Item "upstream\inc" "inc" -Recurse
        Write-Host "Restored pristine ComPort and inc from upstream"

    - name: Apply Source Patch
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        & .\ci_patch.ps1
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::patch failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Setup NuGet
      run: nuget restore .\packages.config -PackagesDirectory .\packages\ 

    - name: Install WDK
      shell: powershell
      run: |
        winget install Microsoft.WindowsWDK.10.0.28000 -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::WDK install failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Driver (UDF)
      id: builddriver
      continue-on-error: true
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        cmd /c "msbuild .\ComPort\htsvsp.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:normal > driver-build.log 2>&1"
        "$LASTEXITCODE" | Out-File driver-exit.txt -Encoding ascii
        Get-Content driver-build.log -Tail 35
        Write-Host "DRIVER_EXIT=$LASTEXITCODE"

    - name: Build vspControl
      id: buildvsp
      continue-on-error: true
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        cmd /c "msbuild .\App\vspControl\vspControl.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:normal > vsp-build.log 2>&1"
        "$LASTEXITCODE" | Out-File vsp-exit.txt -Encoding ascii
        Get-Content vsp-build.log -Tail 20
        Write-Host "VSP_EXIT=$LASTEXITCODE"

    - name: Publish Build Logs On Failure
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        $dc = [int]((Get-Content driver-exit.txt -Raw).Trim())
        $vc = [int]((Get-Content vsp-exit.txt -Raw).Trim())
        Write-Host "RESULTS driver=$dc vsp=$vc"
        if ($dc -ne 0 -or $vc -ne 0) {
          if (Test-Path build-logs) { Remove-Item build-logs -Recurse -Force }
          New-Item -ItemType Directory -Force build-logs | Out-Null
          Copy-Item driver-build.log build-logs\
          Copy-Item vsp-build.log build-logs\
          git config user.name "pannib"
          git config user.email "15039500683@163.com"
          git add build-logs
          git commit -m "diagnostic: build logs [skip ci]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main
          Write-Host "::error::build failed driver=$dc vsp=$vc"
          exit 1
        }
        Write-Host "Both builds succeeded"

    - name: Package Artifacts
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        try {
          $staging = "$env:RUNNER_TEMP\stage"
          New-Item -ItemType Directory -Force $staging | Out-Null
          $searchPaths = @("ComPort", "App")
          if (Test-Path "bin") {
            $searchPaths += "bin"
            Get-ChildItem "bin" -Recurse -File | ForEach-Object { Write-Host "BINFILE $($_.FullName.Replace($env:GITHUB_WORKSPACE, '')) $($_.Length)" }
          }
          $files = Get-ChildItem -Path $searchPaths -Recurse -File -ErrorAction Stop | Where-Object { $_.Extension -in ".dll",".exe",".inf",".cat",".pdb",".sys",".inx",".cer" }
          $files | ForEach-Object { Write-Host "ART $($_.FullName.Replace($env:GITHUB_WORKSPACE, '')) $($_.Length)" }
          if (-not $files) { Write-Host "::error::No artifacts found"; exit 1 }
          foreach ($f in $files) {
            $destName = $f.Name
            if (Test-Path (Join-Path $staging $destName)) { $destName = "$($f.Directory.Name)_$($f.Name)" }
            Copy-Item $f.FullName (Join-Path $staging $destName)
          }
          $devcon = ".\packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\c\tools\10.0.28000.0\x64\devcon.exe"
          Copy-Item $devcon "$staging\devcon.exe"
          Write-Host "STAGE files: $((Get-ChildItem $staging -File).Count)"
          Get-ChildItem $staging -File | ForEach-Object { Write-Host "STAGED $($_.Name) $($_.Length)" }
          Compress-Archive -Path "$staging\*" -DestinationPath "$env:RUNNER_TEMP\htsvsp-build.zip" -Force
          Write-Host "PACK $((Get-Item "$env:RUNNER_TEMP\htsvsp-build.zip").Length) bytes"
        } catch {
          Write-Host "::error::Package step error: $($_.Exception.Message)"
          exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: htsvsp-build
        path: |
          ${{ runner.temp }}/stage/
          ${{ runner.temp }}/htsvsp-build.zip
        if-no-files-found: error

    - name: Commit Build Output to Main
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: powershell
      run: |
        $dst = "$env:GITHUB_WORKSPACE\build-output"
        if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
        New-Item -ItemType Directory -Force $dst | Out-Null
        Copy-Item "$env:RUNNER_TEMP\stage\*" $dst -Force
        Copy-Item "$env:RUNNER_TEMP\htsvsp-build.zip" "$dst\htsvsp-build.zip" -Force
        git config user.name "pannib"
        git config user.email "15039500683@163.com"
        git add build-output
        git status --short
        git commit -m "build output run $env:GITHUB_RUN_NUMBER [skip ci]"
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::nothing committed or commit failed"; exit 1 }
        $pushUrl = "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        git push $pushUrl HEAD:main
        if ($LASTEXITCODE -ne 0) { Write-Host "::error::git push failed exit=$LASTEXITCODE"; exit $LASTEXITCODE }
        Write-Host "COMMIT_PUSHED build-output to main"
